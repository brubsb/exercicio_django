{% extends 'medicos/base.html' %}
{% load static %}

{% block content %}
    <h2>Cadastrar Novo Médico</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="nome_input">Nome:</label>  
            <input type="text" id="nome_input" name="nome" required>
        </div>
        <div class="form-group">
            <label for="sobrenome_input">Sobrenome:</label>  
            <input type="text" id="sobrenome_input" name="sobrenome" required>
        </div>
        <div class="form-group">
            <label for="email_input">Email:</label>  
            <input type="email" id="email_input" name="email" required>
        </div>
        <div class="form-group">
            <label for="especialidades_select">Especialidade:</label>  
            <select name="especialidades" id="especialidades_select" required>
                <option value="" disabled selected>Selecione uma especialidade...</option>
                {% for especialidade in especialidades %}
                    <option value="{{ especialidade.id }}">{{ especialidade.nome_especialidade }}</option>
                {% empty %}
                    <option disabled>Nenhuma especialidade cadastrada. Cadastre uma primeiro.</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">Salvar Médico</button>
    </form>
{% endblock %}
