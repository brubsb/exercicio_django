{% extends 'medico/base.html' %}
{% load static %}

{% block content %}
    <h2>Editando Médico: {{ medico.nome }} {{ medico.sobrenome }}</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="nome_input">Nome:</label>  
            <input type="text" id="nome_input" name="nome" value="{{ medico.nome }}" required>
        </div>
        <div class="form-group">
            <label for="sobrenome_input">Sobrenome:</label>  
            <input type="text" id="sobrenome_input" name="sobrenome" value="{{ medico.sobrenome }}" required>
        </div>
        <div class="form-group">
            <label for="email_input">Email:</label>  
            <input type="email" id="email_input" name="email" value="{{ medico.email }}" required>
        </div>
        <div class="form-group">
            <label for="especialidades_select">Especialidade:</label>  
            <select name="especialidades" id="especialidades_select" required>
                {% for especialidade in especialidades %}
                    <option value="{{ especialidade.id }}" 
                        {% if especialidade in medico.nome_especialidade.all %}selected{% endif %}>
                        {{ especialidade.nome_especialidade }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">Salvar Alterações</button>
    </form>

    <a href="{% url 'lista_medicos' %}" class="btn btn-secondary" style="margin-top: 15px;">Cancelar</a>
{% endblock %}
